<style>
/* ============================================================ TOKENS */
:root{
  --ivory:#F6F3ED; --pearl:#FCFAF6; --bone:#EDE8DE;
  --ink:#1B1C19; --ink-soft:#4A4C46; --ink-mute:#83857C;
  --botanical:#46584B; --botanical-lt:#7D8F80; --champagne:#BFA36B;
  --line:rgba(27,28,25,.12); --line-soft:rgba(27,28,25,.07);
  --glass:rgba(252,250,246,.72);
  --shadow:0 1px 2px rgba(27,28,25,.04), 0 12px 34px -18px rgba(27,28,25,.22);
  --band-bg:#1B1C19; --band-ink:#F6F3ED; --band-ink-soft:rgba(246,243,237,.62);
  --band-ink-mute:rgba(246,243,237,.45); --band-line:rgba(246,243,237,.16); --band-line-strong:rgba(246,243,237,.3);
  --band-accent:#BFA36B;
  --display:"Marcellus","Times New Roman",Times,serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --step--1:clamp(.78rem,.76rem + .1vw,.85rem); --step-0:clamp(.95rem,.92rem + .16vw,1.03rem);
  --step-1:clamp(1.12rem,1.05rem + .34vw,1.3rem); --step-2:clamp(1.45rem,1.3rem + .74vw,2rem);
  --step-3:clamp(1.95rem,1.6rem + 1.7vw,3.1rem); --step-4:clamp(2.4rem,1.85rem + 2.8vw,4rem);
  --gutter:clamp(1.1rem,4vw,3.4rem);
  --ease:cubic-bezier(.22,.61,.36,1); --ease-io:cubic-bezier(.65,0,.35,1);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html[lang="ar"]{ --display:"IBM Plex Sans Arabic","Inter",sans-serif; --body:"IBM Plex Sans Arabic","Inter",sans-serif; }

:root[data-theme="dark"]{
  --ivory:#141610; --pearl:#1B1E16; --bone:#262A1F;
  --ink:#EDEAE0; --ink-soft:#B6B4A7; --ink-mute:#8B8C7E;
  --botanical:#9CB49F; --botanical-lt:#7D8F80; --champagne:#D6B87E;
  --line:rgba(237,234,224,.15); --line-soft:rgba(237,234,224,.08);
  --glass:rgba(20,22,16,.76);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px -18px rgba(0,0,0,.8);
  --band-bg:#0C0E09; --band-ink:#EDEAE0; --band-ink-soft:rgba(237,234,224,.6);
  --band-ink-mute:rgba(237,234,224,.42); --band-line:rgba(237,234,224,.14); --band-line-strong:rgba(237,234,224,.28);
  --band-accent:#D6B87E;
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light;}

*,*::before,*::after{box-sizing:inherit;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--ivory); color:var(--ink); font-family:var(--body); font-size:var(--step-0);
  line-height:1.6; -webkit-font-smoothing:antialiased; overflow:hidden; overscroll-behavior:none;
  transition:background-color .5s var(--ease),color .5s var(--ease);
}
html[lang="ar"] body{line-height:1.85;font-weight:300;}
body.scroll-ok{overflow:auto;}
img,svg,canvas{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
h1,h2,h3,h4{margin:0;font-weight:400;line-height:1.1;letter-spacing:-.01em;font-family:var(--display);}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3,html[lang="ar"] h4{font-weight:300;letter-spacing:0;line-height:1.3;}
p{margin:0;}
:focus-visible{outline:2px solid var(--botanical);outline-offset:3px;border-radius:2px;}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.skip{position:fixed;inset-inline-start:1rem;top:-100px;z-index:999;background:var(--ink);color:var(--ivory);padding:.7rem 1.1rem;border-radius:2px;transition:top .2s;}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 1rem);}

/* ============================================================ LOADER */
#loader{position:fixed;inset:0;z-index:400;background:var(--ivory);display:grid;place-items:center;
  transition:opacity .8s var(--ease),visibility .8s;padding-top:env(safe-area-inset-top,0px);}
#loader.done{opacity:0;visibility:hidden;}
.loader-in{display:grid;justify-items:center;gap:1.6rem;width:min(300px,64vw);}
.loader-logo{width:min(280px,70vw);height:auto;object-fit:contain;animation:fadeIn .9s var(--ease) .2s both;}
.loader-mark{display:none;}
.loader-mark path,.loader-mark circle{fill:none;stroke:var(--botanical);stroke-width:1;
  stroke-dasharray:var(--len,200);stroke-dashoffset:var(--len,200);animation:draw 2s var(--ease) forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
.loader-word{font-family:var(--display);font-size:1.4rem;letter-spacing:.4em;margin-inline-start:.4em;opacity:0;animation:fadeIn .9s var(--ease) .8s forwards;}
.loader-sub{font-size:.76rem;letter-spacing:.1em;color:var(--ink-mute);opacity:0;animation:fadeIn .9s var(--ease) 1.1s forwards;}
html[lang="ar"] .loader-sub{letter-spacing:0;}
.loader-bar{width:100%;height:1px;background:var(--line);position:relative;overflow:hidden;}
.loader-bar i{position:absolute;inset-block:0;inset-inline-start:0;width:0%;background:var(--champagne);transition:width .4s var(--ease);}
@keyframes fadeIn{to{opacity:1;}}

/* ============================================================ HUD */
.hud{position:fixed;top:0;inset-inline:0;z-index:120;padding-top:env(safe-area-inset-top,0px);pointer-events:none;}
.hud-in{display:flex;align-items:center;gap:.9rem;height:72px;max-width:1600px;margin-inline:auto;padding-inline:var(--gutter);}
.hud-in > *{pointer-events:auto;}
.brand{display:flex;align-items:center;gap:.6rem;flex-shrink:0;}
.brand-logo{width:132px;height:52px;object-fit:contain;}
.brand svg{width:24px;height:24px;flex:none;color:var(--ink);}
.brand b{font-family:var(--display);font-weight:400;font-size:1rem;letter-spacing:.3em;margin-inline-start:.28em;}
html[lang="ar"] .brand b{letter-spacing:0;margin-inline-start:0;font-size:1.1rem;}
.hud-spacer{flex:1;}
.pill-group{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--glass);backdrop-filter:blur(14px);}
.pill-group button{padding:.4rem .74rem;font-size:.74rem;letter-spacing:.08em;color:var(--ink-mute);transition:background .3s,color .3s;}
.pill-group button[aria-pressed="true"]{background:var(--ink);color:var(--ivory);}
.tgl{display:grid;place-items:center;width:38px;height:38px;flex:none;border:1px solid var(--line);border-radius:999px;
  color:var(--ink-mute);background:var(--glass);backdrop-filter:blur(14px);transition:color .3s,border-color .3s;}
.tgl:hover{color:var(--ink);border-color:var(--botanical);}
.tgl svg{width:16px;height:16px;}
.tgl .sun{display:none;} :root[data-theme="dark"] .tgl .sun{display:block;}
:root[data-theme="dark"] .tgl .moon{display:none;}
.hud .btn{padding:.68rem 1.2rem;font-size:.8rem;}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.8rem 1.4rem;font-size:var(--step--1);letter-spacing:.04em;border:1px solid var(--ink);
  color:var(--ivory);background:var(--ink);border-radius:999px;overflow:hidden;isolation:isolate;
  transition:transform .3s var(--ease),box-shadow .4s var(--ease);white-space:nowrap;}
html[lang="ar"] .btn{letter-spacing:0;}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--botanical);transform:translateY(101%);transition:transform .5s var(--ease);}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -16px rgba(27,28,25,.5);}
.btn:hover::before{transform:translateY(0);}
.btn:active{transform:translateY(0) scale(.98);}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn.ghost::before{background:var(--ink);}
.btn.ghost:hover{color:var(--ivory);border-color:var(--ink);}
.btn.sm{padding:.55rem 1rem;font-size:.76rem;}
.btn.invert{background:var(--band-ink);color:var(--band-bg);border-color:var(--band-ink);}
.btn.invert::before{background:var(--band-accent);}
.btn.wide{justify-content:space-between;width:100%;}

/* ============================================================ STAGE */
#stage{position:fixed;inset:0;z-index:0;background:
  radial-gradient(120% 90% at 50% 8%,var(--pearl),var(--ivory) 55%,var(--bone) 100%);}
#room-canvas{position:absolute;inset:0;}
#room-canvas canvas{width:100%!important;height:100%!important;display:block;touch-action:none;}
#room-fallback{position:absolute;inset:0;display:none;place-items:center;padding:6vh var(--gutter);}
#room-fallback.on{display:grid;}
#room-fallback svg{width:min(900px,84vw);height:auto;}

.stage-hint{position:absolute;bottom:calc(1.6rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  z-index:5;display:flex;align-items:center;gap:.6rem;font-size:.74rem;letter-spacing:.1em;color:var(--ink-mute);
  background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);padding:.55rem 1rem;border-radius:999px;
  opacity:1;transition:opacity .6s var(--ease);pointer-events:none;}
html[lang="ar"] .stage-hint{letter-spacing:0;}
.stage-hint.hide{opacity:0;}
.stage-hint .dot{width:6px;height:6px;border-radius:50%;background:var(--champagne);animation:pulseDot 1.8s var(--ease-io) infinite;}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.3}}

/* ============================================================ HOTSPOTS */
#hotspots{position:absolute;inset:0;z-index:4;}
.hotspot{
  position:absolute;top:0;left:0;transform:translate(-50%,-100%);
  display:flex;flex-direction:column;align-items:center;gap:.5rem;
  will-change:transform;
}
.hs-dot{
  width:15px;height:15px;border-radius:50%;background:var(--pearl);border:1px solid var(--champagne);
  box-shadow:0 2px 10px rgba(27,28,25,.18);position:relative;transition:transform .35s var(--ease),background .35s;
}
.hs-dot::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid var(--champagne);opacity:.55;
  animation:hsPing 2.6s var(--ease-io) infinite;}
.hotspot:nth-child(3n)::before{animation-delay:.4s;}
.hotspot:nth-child(3n+1) .hs-dot::before{animation-delay:.8s;}
@keyframes hsPing{0%{transform:scale(.7);opacity:.6}75%,100%{transform:scale(2.3);opacity:0}}
.hs-tag{
  display:flex;align-items:center;gap:.5rem;padding:.5rem .85rem .5rem .6rem;border-radius:999px;
  background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:.76rem;letter-spacing:.03em;color:var(--ink-soft);white-space:nowrap;
  transform:translateY(2px);transition:transform .35s var(--ease),background .35s,color .35s,border-color .35s;
}
html[lang="ar"] .hs-tag{letter-spacing:0;}
.hs-tag .ic{width:15px;height:15px;flex:none;color:var(--botanical);}
.hotspot:hover .hs-tag,.hotspot:focus-visible .hs-tag{color:var(--ink);border-color:var(--botanical);transform:translateY(0);}
.hotspot:hover .hs-dot,.hotspot:focus-visible .hs-dot{transform:scale(1.35);background:var(--botanical);border-color:var(--botanical);}
.hotspot:focus-visible{outline:none;}
.hotspot:focus-visible .hs-tag{outline:2px solid var(--botanical);outline-offset:2px;}
@media(max-width:640px){.hs-tag{padding:.42rem .7rem .42rem .5rem;font-size:.7rem;}.hs-tag .ic{width:13px;height:13px;}}

/* ============================================================ PANEL */
#panel-backdrop{position:fixed;inset:0;z-index:150;background:rgba(15,16,12,.4);backdrop-filter:blur(2px);
  opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility .45s;}
#panel-backdrop.on{opacity:1;visibility:visible;}
#panel{
  position:fixed;top:0;bottom:0;inset-inline-end:0;z-index:151;width:min(560px,100%);
  background:var(--ivory);color:var(--ink);box-shadow:-24px 0 60px -20px rgba(0,0,0,.35);
  transform:translateX(105%);transition:transform .5s var(--ease-io);
  display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html[dir="rtl"] #panel{transform:translateX(-105%);}
html[dir="rtl"] #panel.on{transform:translateX(0);}
#panel.on{transform:translateX(0);}
.panel-head{display:flex;align-items:center;gap:.9rem;padding:1.2rem var(--gutter);border-bottom:1px solid var(--line);}
.panel-back{display:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);align-items:center;justify-content:center;flex:none;}
.panel-back.show{display:inline-flex;}
.panel-back svg{width:15px;height:15px;}
html[dir="rtl"] .panel-back svg{transform:scaleX(-1);}
.panel-eyebrow{font-size:.7rem;letter-spacing:.18em;color:var(--botanical);}
html[lang="ar"] .panel-eyebrow{letter-spacing:0;font-size:.8rem;}
.panel-title{font-size:var(--step-2);margin-top:.15rem;}
.panel-close{margin-inline-start:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;flex:none;transition:background .3s,border-color .3s;}
.panel-close:hover{background:var(--bone);border-color:var(--botanical);}
.panel-close svg{width:15px;height:15px;}
.panel-body{overflow-y:auto;padding:1.6rem var(--gutter) 3rem;-webkit-overflow-scrolling:touch;}
.panel-body::-webkit-scrollbar{width:8px;}
.panel-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}
.p-lede{color:var(--ink-soft);font-size:var(--step-0);margin-top:1rem;}
.p-block + .p-block{margin-top:2.2rem;}
.p-block h3{font-size:var(--step-1);margin-bottom:.9rem;}
.p-block p + p{margin-top:.9rem;color:var(--ink-soft);}
.p-block ul{margin:.9rem 0 0;padding-inline-start:1.1rem;display:grid;gap:.5rem;color:var(--ink-soft);}
.p-block li::marker{color:var(--champagne);}

.chips{display:flex;flex-wrap:wrap;gap:.5rem;}
.chip{border:1px solid var(--line);padding:.42rem .8rem;font-size:.78rem;color:var(--ink-soft);border-radius:999px;transition:.3s;}
.chip:hover,.chip:focus-visible{border-color:var(--botanical);color:var(--botanical);}

/* rows (services/doctors lists inside the panel) */
.p-row{display:flex;align-items:center;gap:1rem;width:100%;text-align:start;padding:1rem .2rem;border-top:1px solid var(--line);transition:padding-inline .35s var(--ease),background .35s;}
.p-row:last-child{border-bottom:1px solid var(--line);}
.p-row .num{font-size:.72rem;color:var(--ink-mute);width:2ch;flex:none;}
.p-row .body{flex:1;min-width:0;}
.p-row .t{font-family:var(--display);font-size:var(--step-1);}
html[lang="ar"] .p-row .t{font-size:1.1rem;}
.p-row .d{display:block;font-size:.82rem;color:var(--ink-mute);margin-top:.15rem;}
.p-row .go{flex:none;font-size:1.1rem;color:var(--botanical);opacity:0;transition:opacity .3s;}
.p-row:hover,.p-row:focus-visible{background:linear-gradient(90deg,rgba(125,143,128,.08),transparent);padding-inline:.6rem;}
.p-row:hover .go,.p-row:focus-visible .go{opacity:1;}
.p-media-row{display:flex;gap:1rem;align-items:center;width:100%;text-align:start;padding:.9rem .2rem;border-top:1px solid var(--line);transition:background .35s;}
.p-media-row:last-child{border-bottom:1px solid var(--line);}
.p-media-row:hover,.p-media-row:focus-visible{background:linear-gradient(90deg,rgba(125,143,128,.08),transparent);}
.p-thumb{width:56px;height:56px;flex:none;border-radius:50%;overflow:hidden;position:relative;background:linear-gradient(160deg,var(--bone),rgba(125,143,128,.18));border:1px solid rgba(27,28,25,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.45);}
.p-thumb svg{position:absolute;inset:0;width:100%;height:100%;}
.p-thumb::after{content:attr(data-init);position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--display);font-size:1.05rem;color:var(--ink-mute);opacity:.5;}
.p-media-row .name{font-family:var(--display);font-size:1.02rem;}
.p-media-row .spec{font-size:.78rem;color:var(--ink-mute);margin-top:.1rem;}
.docs{display:grid;gap:1rem;}
@media(min-width:600px){.docs{grid-template-columns:repeat(2,1fr);}}
@media(min-width:960px){.docs{grid-template-columns:repeat(3,1fr);}}
.doc{
  background:rgba(255,255,255,.35);padding:clamp(1.2rem,2.2vw,1.8rem);text-align:start;
  display:grid;gap:1rem;align-content:start;position:relative;border:1px solid rgba(27,28,25,.09);
  border-radius:22px;box-shadow:0 10px 24px -18px rgba(27,28,25,.28);
  transition:background .5s var(--ease),transform .5s var(--ease),box-shadow .5s var(--ease),border-color .5s var(--ease);
}
.doc:hover,.doc:focus-visible{background:var(--pearl);border-color:rgba(27,28,25,.14);box-shadow:0 18px 35px -22px rgba(27,28,25,.32);transform:translateY(-2px);}
.doc-portrait{
  aspect-ratio:4/5;overflow:hidden;position:relative;border-radius:16px;
  background:linear-gradient(165deg,var(--bone),rgba(125,143,128,.18));
  border:1px solid rgba(27,28,25,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
}
.doc h3{font-size:var(--step-1);margin:0;}
.doc .spec{font-size:var(--step--1);color:var(--ink-mute);line-height:1.5;}
.doc .more{font-size:.72rem;letter-spacing:.16em;color:var(--botanical);opacity:0;transform:translateY(5px);transition:.4s var(--ease);}
.doc:hover .more,.doc:focus-visible .more{opacity:1;transform:none;}
.media{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--bone),rgba(125,143,128,.18));}
.media>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center center;background:linear-gradient(160deg,var(--bone),rgba(125,143,128,.18));opacity:0;transition:opacity .7s var(--ease),transform .9s var(--ease);}
.media>img.loaded{opacity:1;}
:root[data-theme="dark"] .media>img{filter:brightness(.88) contrast(1.02);}

.stat-mini{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin-top:1.4rem;}
.stat-mini div{background:rgba(255,255,255,.35);border:1px solid rgba(27,28,25,.08);border-radius:16px;padding:1rem 1.1rem;box-shadow:0 10px 18px -18px rgba(27,28,25,.28);}
.stat-mini b{display:block;font-family:var(--display);font-size:var(--step-2);font-variant-numeric:tabular-nums;}
.stat-mini span{display:block;margin-top:.3rem;font-size:.74rem;color:var(--ink-mute);letter-spacing:.06em;}
html[lang="ar"] .stat-mini span{letter-spacing:0;}

.p-flower{aspect-ratio:1/1;max-width:200px;margin:0 auto 1.2rem;}
.petal{fill:none;stroke:var(--botanical);stroke-width:.7;opacity:.55;}

.p-gal{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin-top:1rem;}
.p-gal figure{margin:0;aspect-ratio:4/5;overflow:hidden;position:relative;background:linear-gradient(160deg,var(--bone),rgba(125,143,128,.18));border:1px solid rgba(27,28,25,.08);border-radius:16px;box-shadow:0 10px 18px -18px rgba(27,28,25,.3);}
.p-gal button{display:block;width:100%;height:100%;padding:0;}
.p-gal .tile,.p-gal img{width:100%;height:100%;object-fit:contain;object-position:center center;}

.empty{border:1px dashed var(--line);padding:1.5rem;border-radius:6px;display:grid;gap:.7rem;}
.empty .h{font-family:var(--display);font-size:var(--step-1);}
.note{font-size:.82rem;color:var(--ink-mute);line-height:1.6;}

.field{display:grid;gap:.45rem;margin-top:0;}
.field label{font-size:.74rem;letter-spacing:.1em;color:var(--ink-mute);}
html[lang="ar"] .field label{letter-spacing:0;font-size:.82rem;}
.field input,.field select,.field textarea{font:inherit;font-size:var(--step-0);color:var(--ink);background:transparent;
  border:0;border-bottom:1px solid var(--line);padding:.6rem 0;width:100%;transition:border-color .3s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-bottom-color:var(--botanical);}
.field textarea{resize:vertical;min-height:80px;}
.form-grid{display:grid;gap:1.1rem;}
.formstate{display:none;padding:.9rem 1rem;border:1px solid var(--botanical);background:rgba(125,143,128,.08);font-size:.85rem;border-radius:4px;}
.formstate.on{display:block;}
.field select option{color:#1B1C19;background:#FCFAF6;}
:root[data-theme="dark"] .field select option{color:#EDEAE0;background:#1B1E16;}

.contact-mini{display:grid;gap:.8rem;margin-top:1.2rem;}
.contact-mini div{background:rgba(255,255,255,.35);border:1px solid rgba(27,28,25,.08);border-radius:16px;padding:.9rem 1.1rem;box-shadow:0 10px 18px -18px rgba(27,28,25,.28);}
.contact-mini .k{font-size:.7rem;letter-spacing:.14em;color:var(--ink-mute);}
html[lang="ar"] .contact-mini .k{letter-spacing:0;}
.contact-mini a.v,.contact-mini .v{display:block;margin-top:.2rem;font-family:var(--display);font-size:var(--step-0);}
.acc{border-top:1px solid var(--line);margin-top:1.4rem;}
.acc-item{border-bottom:1px solid var(--line);}
.acc-q{width:100%;display:flex;gap:1rem;align-items:center;justify-content:space-between;padding:1rem .1rem;text-align:start;font-family:var(--display);font-size:var(--step-0);}
.acc-q .ic{flex:none;width:16px;height:16px;position:relative;transition:transform .4s var(--ease);}
.acc-q .ic::before,.acc-q .ic::after{content:"";position:absolute;background:var(--botanical);}
.acc-q .ic::before{inset-inline:0;top:50%;height:1px;margin-top:-.5px;}
.acc-q .ic::after{inset-block:0;left:50%;width:1px;margin-left:-.5px;transition:opacity .35s;}
.acc-item.open .acc-q .ic{transform:rotate(90deg);}
.acc-item.open .acc-q .ic::after{opacity:0;}
.acc-a{max-height:0;overflow:hidden;transition:max-height .5s var(--ease);}
.acc-a>div{padding:0 0 1.2rem;color:var(--ink-soft);font-size:.9rem;}

#light{position:fixed;inset:0;z-index:250;background:color-mix(in srgb,var(--band-bg) 96%,transparent);display:none;place-items:center;padding:2rem;}
#light.on{display:grid;}
#light .frame{max-width:min(760px,90vw);width:100%;}
#light .frame img,#light .frame svg{width:100%;height:auto;border:1px solid var(--band-line);border-radius:4px;}
#light .meta{display:flex;justify-content:space-between;color:var(--band-ink-soft);font-size:.78rem;margin-top:.8rem;}
#light .x,#light .p,#light .n{position:absolute;color:var(--band-ink);padding:1rem;font-size:.85rem;letter-spacing:.08em;}
#light .x{top:calc(env(safe-area-inset-top,0px) + .6rem);inset-inline-end:.6rem;}
#light .p{inset-inline-start:.4rem;top:50%;} #light .n{inset-inline-end:.4rem;top:50%;}

/* ============================================================ MOBILE PANEL */
@media(max-width:640px){#panel{width:100%;}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
}

/* ---------------------------------------------------------------- MEDIA TILES */
function initials(name){
  if(!name) return "—";
  var p=name.replace(/^(Dr\.|Professor|د\.|الأستاذ الدكتور)\s*/,"").trim().split(/\s+/);
  return (p[0]||"").charAt(0)+(p[1]?p[1].charAt(0):"");
}
function tile(seed,w,h){
  var r=function(n){var x=Math.sin(seed*99.13+n*37.7)*10000;return x-Math.floor(x);};
  var hues=[[70,88,75],[191,163,107],[237,232,222]];
  var a=hues[Math.floor(r(1)*3)], b=hues[Math.floor(r(2)*3)], g="g"+seed+"_"+w+"_"+h;
  var blobs="";
  for(var i=0;i<3;i++) blobs+='<ellipse cx="'+(18+r(i+3)*64)+'%" cy="'+(18+r(i+9)*64)+'%" rx="'+(18+r(i+5)*24)+'%" ry="'+(16+r(i+7)*22)+'%" fill="url(#'+g+')" opacity="'+(0.22+r(i+11)*0.3).toFixed(2)+'"/>';
  return '<svg class="tile" viewBox="0 0 100 '+Math.round(100*h/w)+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<defs><radialGradient id="'+g+'"><stop offset="0%" stop-color="rgb('+a.join(",")+')" stop-opacity=".55"/>'+
    '<stop offset="100%" stop-color="rgb('+b.join(",")+')" stop-opacity="0"/></radialGradient></defs>'+
    '<rect width="100" height="'+Math.round(100*h/w)+'" fill="var(--bone)"/>'+blobs+'</svg>';
}
function pic(src,alt,seed,w,h){
  if(src) return '<img data-src="'+esc(src)+'" alt="'+esc(alt)+'" width="'+w+'" height="'+h+'">';
  return tile(seed,w,h);
}
function attachImages(root){
  $$("img[data-src]",root||document).forEach(function(im){
    var frame=im.parentNode;
    var markLoaded=function(){
      im.classList.add("loaded");
      if(frame && frame.classList) frame.classList.add("has-img");
    };
    im.loading="lazy"; im.decoding="async";
    im.addEventListener("load",markLoaded);
    im.addEventListener("error",function(){ if(im.parentNode) im.parentNode.removeChild(im); });
    im.src=im.getAttribute("data-src"); im.removeAttribute("data-src");
    if(im.complete && im.naturalWidth > 0) markLoaded();
  });
}

function storedTheme(){ try{ return localStorage.getItem("kadina-theme"); }catch(e){ return null; } }
function systemDark(){ return window.matchMedia("(prefers-color-scheme: dark)").matches; }
function isDark(){ return document.documentElement.getAttribute("data-theme")==="dark"; }
function applyTheme(mode,persist){
  document.documentElement.setAttribute("data-theme",mode);
  var mt=document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute("content", mode==="dark"?"#141610":"#F6F3ED");
  if(persist){ try{ localStorage.setItem("kadina-theme",mode); }catch(e){} }
  $$(".tgl").forEach(function(b){ b.setAttribute("aria-pressed",String(mode==="dark")); });
  if(window.__kadinaRoom && window.__kadinaRoom.setTheme) window.__kadinaRoom.setTheme(mode==="dark");
}

function openPanel(type,detail){
  state.panel=type; state.detail=detail||null;
  renderPanel();
  $("#panel").classList.add("on"); $("#panel-backdrop").classList.add("on");
  $("#stagehint").classList.add("hide");
  syncHash();
  setTimeout(function(){ var f=$("#panel .panel-close"); if(f) f.focus(); },350);
}
function closePanel(){
  state.panel=null; state.detail=null;
  $("#panel").classList.remove("on"); $("#panel-backdrop").classList.remove("on");
  syncHash();
  if(state.lastTrigger){ state.lastTrigger.focus(); state.lastTrigger=null; }
}
function panelBack(){
  if(state.detail){ state.detail=null; renderPanel(); }
  else closePanel();
}
function renderPanel(){
  var type=state.panel; if(!type) return;
  var data;
  if(type==="services" && state.detail) data=pServiceDetail(state.detail);
  else if(type==="doctors" && state.detail) data=pDoctorDetail(state.detail);
  else if(type==="appointment") data=pAppointment(state.detail);
  else data=(PANEL_FN[type]||pAbout)();
  $("#panelEyebrow").textContent=data.eyebrow;
  $("#panelTitle").textContent=data.title;
  $("#panelBack").classList.toggle("show", !!data.back);
  $("#panelBody").innerHTML=data.html;
  document.title=data.title+" — "+(state.lang==="ar"?"مركز كادينا الطبي":"Kadina Medical Center");
  wirePanelBody();
}
$("#panelClose").addEventListener("click",closePanel);
$("#panelBack").addEventListener("click",panelBack);
$("#panel-backdrop").addEventListener("click",closePanel);
window.addEventListener("keydown",function(e){
  if(e.key==="Escape" && $("#panel").classList.contains("on") && !$("#light").classList.contains("on")) closePanel();
});

function wirePanelBody(){
  var body=$("#panelBody");
  gallery(body);
  attachImages(body);
  countUp(body);
  $$("[data-svc]",body).forEach(function(b){ b.addEventListener("click",function(e){ e.preventDefault(); state.lastTrigger=b; openPanel("services",b.getAttribute("data-svc")); }); });
  $$("[data-doc]",body).forEach(function(b){ b.addEventListener("click",function(e){ e.preventDefault(); state.lastTrigger=b; openPanel("doctors",b.getAttribute("data-doc")); }); });
  $$("[data-open-appt]",body).forEach(function(b){ b.addEventListener("click",function(){ openPanel("appointment", b.getAttribute("data-open-appt")||null); }); });
  $$("[data-tel]",body).forEach(function(b){ b.addEventListener("click",function(){ location.href=SITE.phoneHref; }); });
  accordion(body);
  form(body);
}
function countUp(root){
  var box=$(".stat-mini",root); if(!box) return;
  $$("b[data-to]",box).forEach(function(n){
    var to=parseInt(n.getAttribute("data-to"),10);
    if(RM){ n.textContent=to.toLocaleString(state.lang==="ar"?"ar-EG":"en-US"); return; }
    var st=null,dur=1200;
    (function step(ts){ if(!st) st=ts; var p=Math.min((ts-st)/dur,1),e=1-Math.pow(1-p,3);
      n.textContent=Math.round(to*e).toLocaleString(state.lang==="ar"?"ar-EG":"en-US");
      if(p<1) requestAnimationFrame(step); })();
  });
}
function accordion(root){
  $$(".acc-q",root).forEach(function(q){
    q.addEventListener("click",function(){
      var item=q.parentNode, open=item.classList.contains("open");
      $$(".acc-item",root).forEach(function(it){ it.classList.remove("open"); it.querySelector(".acc-q").setAttribute("aria-expanded","false"); it.querySelector(".acc-a").style.maxHeight="0px"; });
      if(!open){ item.classList.add("open"); q.setAttribute("aria-expanded","true"); var a=item.querySelector(".acc-a"); a.style.maxHeight=a.scrollHeight+"px"; }
    });
  });
}
function gallery(root){
  var box=$("#pgal",root); if(!box) return;
  var figs=$$("figure",box), cur=0, lb=$("#light");
  function show(i){ cur=(i+figs.length)%figs.length; var f=figs[cur], im=f.querySelector("img.loaded, img");
    $("#lframe").innerHTML = im ? '<img src="'+(im.getAttribute("src")||im.getAttribute("data-src"))+'" alt="'+(im.getAttribute("alt")||"")+'">' : f.querySelector("svg").outerHTML;
    $("#lcap").textContent="Kadina Medical Center"; $("#lidx").textContent=(cur+1)+" / "+figs.length;
    lb.classList.add("on"); $("#lx").focus(); }
  function close(){ lb.classList.remove("on"); }
  $$("button[data-g]",box).forEach(function(b){ b.addEventListener("click",function(){ show(parseInt(b.getAttribute("data-g"),10)); }); });
  $("#lx").onclick=close; $("#lp").onclick=function(){show(cur-1);}; $("#ln").onclick=function(){show(cur+1);};
  lb.onclick=function(e){ if(e.target===lb) close(); };
  lb.addEventListener("keydown",function(e){ if(e.key==="Escape") close(); if(e.key==="ArrowRight") show(document.dir==="rtl"?cur-1:cur+1); if(e.key==="ArrowLeft") show(document.dir==="rtl"?cur+1:cur-1); });
}
function form(root){
  var f=$("#apptform",root); if(!f) return;
  f.addEventListener("submit",function(e){
    e.preventDefault();
    var ok=true;
    [$("#af1",f),$("#af2",f)].forEach(function(el){ if(!el.value.trim()){ ok=false; el.style.borderBottomColor="var(--champagne)"; } else el.style.borderBottomColor=""; });
    var st=$("#apptstate",f);
    st.textContent = ok ? t().formOk : t().formErr;
    st.classList.add("on"); st.scrollIntoView({behavior:RM?"auto":"smooth",block:"center"});
  });
}

/* ---------------------------------------------------------------- HASH SYNC */
function syncHash(){
  var h="#/"+state.lang+(state.panel?"/"+state.panel+(state.detail?"/"+state.detail:""):"");
  if(location.hash!==h) history.replaceState(null,"",h);
}
function applyHash(){
  var seg=(location.hash||"").replace(/^#\/?/,"").split("/").filter(Boolean);
  var lang=(seg[0]==="ar"||seg[0]==="en")?seg.shift():"en";
  var panel=seg.shift()||null, detail=seg.shift()||null;
  var langChanged = lang!==state.lang;
  state.lang=lang;
  if(langChanged){ renderHUD(); renderHotspots(); }
  if(panel){ state.panel=panel; state.detail=detail; renderPanel();
    $("#panel").classList.add("on"); $("#panel-backdrop").classList.add("on");}
  else { state.panel=null; state.detail=null;
    $("#panel").classList.remove("on"); $("#panel-backdrop").classList.remove("on");}
}

function flowerInline(size){
  var n=10,s="";
  for(var i=0;i<n;i++) s+='<path d="'+petalPath(i,n,size*0.14,size*0.42,0,0)+'" fill="var(--champagne)" fill-opacity=".28" stroke="var(--champagne)" stroke-width="0.25"/>';
  return s+'<circle r="'+(size*0.1)+'" fill="var(--champagne)" fill-opacity=".5"/>';
}

/* ---------------------------------------------------------------- ROOM: THREE.JS */
function buildRoom3D(){
  var host=$("#room-canvas");
  var c=document.createElement("canvas");
  var gl=c.getContext("webgl2")||c.getContext("webgl")||c.getContext("experimental-webgl");
  if(!gl) return null;
  var renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:c,antialias:!MOBILE,alpha:false,powerPreference:"high-performance"}); }
  catch(e){ return null; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, MOBILE?1.4:1.8));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  host.appendChild(c);

  var scene=new THREE.Scene();
  var camera=new THREE.OrthographicCamera(-1,1,1,-1,0.1,60);
  var palette=[]; /* [material, lightHex, darkHex] */
  function newMat(lightHex,darkHex,rough,metal,opts){
    var o=Object.assign({color:lightHex,roughness:rough==null?.55:rough,metalness:metal||0},opts||{});
    var m=new THREE.MeshStandardMaterial(o);
    palette.push([m,lightHex,darkHex]);
    return m;
  }
  function addMesh(geo,mat,x,y,z,rx,ry,rz,sx,sy,sz){
    var mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(x,y,z);
    if(rx||ry||rz) mesh.rotation.set(rx||0,ry||0,rz||0);
    if(sx!=null) mesh.scale.set(sx, sy==null?sx:sy, sz==null?sx:sz);
    group.add(mesh);
    return mesh;
  }
  function blob(x,z,r){
    var g=new THREE.Mesh(new THREE.CircleGeometry(r,20),
      new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.1,depthWrite:false}));
    g.rotation.x=-Math.PI/2; g.position.set(x,0.012,z); group.add(g); return g;
  }

  var group=new THREE.Group(); scene.add(group);

  /* materials */
  var mFloor=newMat(0xFCFAF6,0x1B1E16,.85,0);
  var mWall=newMat(0xEDE8DE,0x262A1F,.9,0);
  var mWall2=newMat(0xF2EEE3,0x22261C,.9,0);
  var mRug=newMat(0x7D8F80,0x54614F,.8,0,{transparent:true,opacity:.55});
  var mWood=newMat(0xC7B79A,0x4A4030,.6,0);
  var mWoodDk=newMat(0xA3927A,0x33291D,.65,0);
  var mGold=newMat(0xBFA36B,0xD6B87E,.35,.55);
  var mScreen=newMat(0x2B2E26,0x0C0E09,.4,.2,{emissive:0x9cb49f,emissiveIntensity:.15});
  var mPearl=newMat(0xF7F2E9,0xD9D2C2,.25,0,{transparent:true,opacity:.92});
  var mLeaf=newMat(0x7D8F80,0x6C7C68,.6,0);
  var mLeafDeep=newMat(0x46584B,0x384637,.6,0);
  var mFrameGold=newMat(0xBFA36B,0xD6B87E,.35,.6);
  var mFrameDark=newMat(0x4A4C46,0x0C0E09,.5,.3);
  var mPhoto=newMat(0xEDE8DE,0x30352A,.8,0);
  var mArt=newMat(0xC9D6C6,0x384637,.7,0);
  var mGlass=newMat(0xDCE7DE,0x2C3A31,.15,.1,{transparent:true,opacity:.42});
  var mPotStone=newMat(0xD9D3C4,0x2A2D22,.8,0);
  var mStone=newMat(0xD9D3C4,0x353A2B,.75,0);

  /* --- shell --- */
  addMesh(new THREE.BoxGeometry(9,0.2,8), mFloor, 0,-0.1,-0.2);
  addMesh(new THREE.BoxGeometry(9,4,0.2), mWall, 0,2,-4.1);
  addMesh(new THREE.BoxGeometry(0.2,4,8), mWall2, -4.55,2,-0.2);
  addMesh(new THREE.CylinderGeometry(1.55,1.55,0.03,40), mRug, 0,0.02,-1.35);

  /* --- story: Cady flower sculpture --- */
  addMesh(new THREE.CylinderGeometry(0.34,0.42,0.9,18), mStone, 0,0.45,-2.55);
  addMesh(new THREE.CylinderGeometry(0.5,0.5,0.05,24), mGold, 0,0.91,-2.55);
  var flowerGroup=new THREE.Group(); flowerGroup.position.set(0,1.18,-2.55); group.add(flowerGroup);
  flowerGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.15,16,12),mGold));
  for(var pi=0;pi<9;pi++){
    var pa=(pi/9)*Math.PI*2, pg=new THREE.BoxGeometry(0.13,0.5,0.035);
    var pm=new THREE.Mesh(pg,mPearl);
    pm.position.set(Math.cos(pa)*0.13,0.24,Math.sin(pa)*0.13);
    pm.rotation.z = Math.cos(pa)* -0.55; pm.rotation.x = Math.sin(pa)*0.55; pm.rotation.y=-pa;
    flowerGroup.add(pm);
  }
  blob(0,-2.55,0.62);

  /* --- about: reception desk --- */
  addMesh(new THREE.BoxGeometry(1.55,0.86,0.66), mWood, -2.65,0.43,-1.05);
  addMesh(new THREE.BoxGeometry(1.72,0.06,0.8), mGold, -2.65,0.89,-1.05);
  addMesh(new THREE.BoxGeometry(0.46,0.32,0.04), mScreen, -2.65,1.14,-1.33,-0.12,0,0);
  addMesh(new THREE.CylinderGeometry(0.03,0.05,0.16,10), mWoodDk, -2.65,0.97,-1.3);
  blob(-2.65,-1.05,0.85);

  /* --- doctors: portrait wall --- */
  [-1.65,-1.05,-0.45].forEach(function(x,i){
    addMesh(new THREE.BoxGeometry(0.46,0.6,0.045), mFrameGold, x,2.0,-3.98);
    addMesh(new THREE.BoxGeometry(0.36,0.5,0.02), mPhoto, x,2.0,-3.965);
  });

  /* --- gallery: art wall --- */
  [1.05,1.68,2.31].forEach(function(x,i){
    addMesh(new THREE.BoxGeometry(0.5,0.62,0.045), mFrameDark, x,2.0,-3.98);
    addMesh(new THREE.BoxGeometry(0.4,0.5,0.02), mArt, x,2.0,-3.965);
  });

  /* --- services: treatment chair --- */
  addMesh(new THREE.CylinderGeometry(0.32,0.38,0.1,20), mFrameDark, 2.5,0.06,-0.55);
  addMesh(new THREE.CylinderGeometry(0.05,0.05,0.35,10), mFrameDark, 2.5,0.28,-0.55);
  addMesh(new THREE.BoxGeometry(0.72,0.16,0.7), mArt, 2.5,0.53,-0.55);
  addMesh(new THREE.BoxGeometry(0.72,0.82,0.14), mArt, 2.5,1.02,-0.86,-0.12,0,0);
  var lampArm=new THREE.Group(); lampArm.position.set(2.5,1.55,-0.2); group.add(lampArm);
  (function(){ var arm=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.7,8),mGold); arm.position.set(0,0.3,0); arm.rotation.z=0.5; lampArm.add(arm);
    var head=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10), newMat(0xFFF3D8,0xFFE9B8,.2,.1,{emissive:0xffdca0,emissiveIntensity:.5}));
    head.position.set(0.55,0.55,0); lampArm.add(head); lampArm.userData.head=head; })();
  window.__kadinaLampArm=lampArm;
  blob(2.5,-0.55,0.62);

  /* --- appointment: kiosk --- */
  addMesh(new THREE.BoxGeometry(0.5,1.05,0.34), mWoodDk, 2.85,0.53,1.7);
  addMesh(new THREE.BoxGeometry(0.4,0.5,0.03), mScreen, 2.85,0.96,1.53,-0.28,0,0);
  addMesh(new THREE.BoxGeometry(0.5,0.04,0.34), mGold, 2.85,1.07,1.7);
  blob(2.85,1.7,0.5);

  /* --- contact: window + shelf + plant --- */
  addMesh(new THREE.BoxGeometry(0.05,1.3,1.3), mGlass, -4.44,1.9,0.55);
  addMesh(new THREE.BoxGeometry(0.28,0.07,1.15), mWood, -4.28,1.14,0.55);
  addMesh(new THREE.CylinderGeometry(0.11,0.13,0.2,14), mPotStone, -4.25,1.28,0.25);
  addMesh(new THREE.ConeGeometry(0.16,0.4,10), mLeaf, -4.25,1.55,0.25);
  addMesh(new THREE.ConeGeometry(0.11,0.3,10), mLeafDeep, -4.25,1.75,0.22);

  /* --- journal: side table --- */
  addMesh(new THREE.CylinderGeometry(0.42,0.42,0.5,20), mWood, -0.55,0.25,1.9);
  addMesh(new THREE.BoxGeometry(0.28,0.035,0.2), mPearl, -0.55,0.52,1.9);
  addMesh(new THREE.BoxGeometry(0.03,0.038,0.2), mGold, -0.65,0.522,1.9);
  blob(-0.55,1.9,0.55);

  /* --- decorative plants (non-interactive) --- */
  [[-4.0,-3.7],[3.7,-3.7]].forEach(function(p){
    addMesh(new THREE.CylinderGeometry(0.16,0.19,0.32,14), mPotStone, p[0],0.16,p[1]);
    addMesh(new THREE.ConeGeometry(0.26,0.7,10), mLeaf, p[0],0.68,p[1]);
    addMesh(new THREE.ConeGeometry(0.18,0.5,10), mLeafDeep, p[0],1.0,p[1]);
    blob(p[0],p[1],0.4);
  });

  /* --- lights --- */
  var hemi=new THREE.HemisphereLight(0xfff6ea,0xcac2ab,.7); scene.add(hemi);
  var key=new THREE.DirectionalLight(0xfff2df,1.0); key.position.set(6,8,5); scene.add(key);
  var rim=new THREE.DirectionalLight(0xc9d6c6,.35); rim.position.set(-5,3,-4); scene.add(rim);

  /* glow ring for hover feedback */
  var ring=new THREE.Mesh(new THREE.RingGeometry(0.55,0.85,40),
    new THREE.MeshBasicMaterial({color:0xbfa36b,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));
  ring.rotation.x=-Math.PI/2; ring.position.y=0.015; scene.add(ring);
  var ringTarget={x:0,z:0,op:0}, ringCur={x:0,z:0,op:0};

  /* ---- camera framing ---- */
  var HALF=5.6;
  function frame(){
    var w=host.clientWidth||1,h=host.clientHeight||1, aspect=w/h;
    var halfH,halfW;
    if(aspect>=1){ halfH=HALF; halfW=Math.min(halfH*aspect,9.5); }
    else{ halfW=4.7; halfH=Math.min(halfW/aspect,9.5); }
    camera.left=-halfW; camera.right=halfW; camera.top=halfH; camera.bottom=-halfH;
    camera.updateProjectionMatrix();
    renderer.setSize(w,h,false);
  }
  var camDist=13, camBase=new THREE.Vector3(camDist*0.62,camDist*0.52,camDist*0.62), camTarget=new THREE.Vector3(0,0.55,-1.1);
  camera.position.copy(camBase); camera.lookAt(camTarget);

  /* ---- interaction: parallax only, no orbit ---- */
  var tx=0,ty=0,mx=0,my=0;
  function onMove(e){ var w=window.innerWidth,h=window.innerHeight; tx=(e.clientX/w-0.5)*2; ty=(e.clientY/h-0.5)*2; }
  if(!COARSE && !RM) window.addEventListener("mousemove",onMove,{passive:true});

  var ro = window.ResizeObserver ? new ResizeObserver(frame) : null;
  if(ro) ro.observe(host); else window.addEventListener("resize",frame);
  frame();

  var visible=true;
  var vio=("IntersectionObserver" in window) ? new IntersectionObserver(function(en){visible=en[0].isIntersecting;},{threshold:.01}) : null;
  if(vio) vio.observe(host);

  var api = {
    active:true,
    project:function(world){
      var v=new THREE.Vector3(world.x,world.y,world.z).project(camera);
      var w=host.clientWidth,h=host.clientHeight;
      return { x:(v.x*0.5+0.5)*w, y:(1-(v.y*0.5+0.5))*h, visible: v.z<1 };
    },
    setHover:function(id){
      var h=id?HOTSPOTS.filter(function(x){return x.id===id;})[0]:null;
      if(h){ ringTarget.x=h.world.x; ringTarget.z=h.world.z; ringTarget.op=.32; }
      else ringTarget.op=0;
    },
    setTheme:function(dark){
      palette.forEach(function(p){ p[0].color.setHex(dark?p[2]:p[1]); });
      hemi.intensity = dark?.28:.7;
      key.intensity = dark?1.25:1.0;
      key.color.setHex(dark?0xfff0d6:0xfff2df);
      rim.intensity = dark?.5:.35;
      renderer.setClearColor(dark?0x0e100a:0xf6f3ed,1);
    },
    dispose:function(){
      alive=false;
      if(ro) ro.disconnect(); else window.removeEventListener("resize",frame);
      if(vio) vio.disconnect();
      window.removeEventListener("mousemove",onMove);
      scene.traverse(function(o){ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
      renderer.dispose();
      if(renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
    }
  };
  api.setTheme(isDark());

  var alive=true, t0=performance.now();
  (function loop(now){
    if(!alive) return;
    requestAnimationFrame(loop);
    if(!visible || document.hidden) return;
    var e=(now-t0)/1000;
    mx+=(tx-mx)*.05; my+=(ty-my)*.05;
    camera.position.x = camBase.x + mx*0.9;
    camera.position.y = camBase.y - my*0.5;
    camera.lookAt(camTarget);

    flowerGroup.rotation.y = e*0.22;
    if(window.__kadinaLampArm) window.__kadinaLampArm.rotation.z = Math.sin(e*0.6)*0.05;

    ringCur.x+=(ringTarget.x-ringCur.x)*.18; ringCur.z+=(ringTarget.z-ringCur.z)*.18; ringCur.op+=(ringTarget.op-ringCur.op)*.15;
    ring.position.x=ringCur.x; ring.position.z=ringCur.z; ring.material.opacity=ringCur.op;
    ring.scale.setScalar(1+Math.sin(e*2)*0.03);

    renderer.render(scene,camera);
    positionHotspots();
  })(t0);

  return api;
}

/* ---------------------------------------------------------------- ROOM BOOT */
function initRoom(){
  var room=null;
  document.body.classList.remove("photo-theme");
  if(!RM){ try{ room=buildRoom3D(); }catch(e){ room=null; } }
  if(room){
    window.__kadinaRoom=room;
    $("#room-canvas").style.display="block";
    $("#room-fallback").classList.remove("on");
  }else{
    window.__kadinaRoom=null;
    $("#room-canvas").style.display="none";
    $("#room-fallback").innerHTML=buildFallbackSVG();
    $("#room-fallback").classList.add("on");
  }
  renderHotspots();
  wireHotspotHover();
  window.addEventListener("resize",positionHotspots);
}
function wireHotspotHover(){
  $$(".hotspot").forEach(function(b){
    var on=function(){ if(window.__kadinaRoom) window.__kadinaRoom.setHover(b.getAttribute("data-hs")); };
    var off=function(){ if(window.__kadinaRoom) window.__kadinaRoom.setHover(null); };
    b.addEventListener("mouseenter",on); b.addEventListener("focus",on);
    b.addEventListener("mouseleave",off); b.addEventListener("blur",off);
  });
}

/* ---------------------------------------------------------------- BOOT */
window.addEventListener("hashchange",applyHash);
function boot(){
  renderHUD();
  initRoom();
  if(location.hash) applyHash(); else syncHash();

  var bar=$("#lbar"), sub=$("#loadersub"), L0=T.en, words=L0.loaderWords, wi=0;
  var wt = RM ? null : setInterval(function(){ wi=(wi+1)%words.length; sub.textContent=t().loaderWords[wi%t().loaderWords.length]; },700);
  var p=0;
  var tick=setInterval(function(){
    p=Math.min(p+16+Math.random()*22,100); bar.style.width=p+"%";
    if(p>=100){ clearInterval(tick); if(wt) clearInterval(wt);
      setTimeout(function(){ $("#loader").classList.add("done");
        setTimeout(function(){ var l=$("#loader"); if(l&&l.parentNode) l.parentNode.removeChild(l); },900);
      },RM?0:280);
      setTimeout(function(){ $("#stagehint").classList.add("hide"); },5200);
    }
  },RM?1:170);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
})();
