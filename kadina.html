<style>
/* ============================================================
   KADINA — DESIGN TOKENS
   Palette: ivory ground, pearl surfaces, warm charcoal ink,
   muted botanical green (the Cady leaf), champagne as hairline only.
   ============================================================ */
:root{
  --ivory:#F6F3ED;
  --pearl:#FCFAF6;
  --bone:#EDE8DE;
  --ink:#1B1C19;
  --ink-soft:#4A4C46;
  --ink-mute:#83857C;
  --botanical:#46584B;
  --botanical-lt:#7D8F80;
  --champagne:#BFA36B;
  --line:rgba(27,28,25,.12);
  --line-soft:rgba(27,28,25,.07);
  --glass:rgba(252,250,246,.72);
  --shadow:0 1px 2px rgba(27,28,25,.04), 0 12px 34px -18px rgba(27,28,25,.22);

  /* The contrast band (stats, appointment, menu, footer). Charcoal on ivory
     in light mode; in dark mode it sinks darker rather than inverting to
     ivory, which would glare. */
  --band-bg:#1B1C19;
  --band-ink:#F6F3ED;
  --band-ink-soft:rgba(246,243,237,.62);
  --band-ink-mute:rgba(246,243,237,.45);
  --band-line:rgba(246,243,237,.16);
  --band-line-strong:rgba(246,243,237,.30);
  --band-accent:#BFA36B;

  --display:"Marcellus", "Times New Roman", Times, serif;
  --body:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

  --step--1:clamp(.78rem,.76rem + .1vw,.85rem);
  --step-0:clamp(.95rem,.92rem + .16vw,1.03rem);
  --step-1:clamp(1.12rem,1.05rem + .34vw,1.3rem);
  --step-2:clamp(1.45rem,1.3rem + .74vw,2rem);
  --step-3:clamp(1.95rem,1.6rem + 1.7vw,3.1rem);
  --step-4:clamp(2.5rem,1.8rem + 3.4vw,5rem);
  --step-5:clamp(3rem,1.9rem + 5.4vw,7.2rem);

  --gutter:clamp(1.15rem,4vw,4.5rem);
  --maxw:1440px;
  --rhythm:clamp(4.5rem,11vh,9rem);

  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-io:cubic-bezier(.65,0,.35,1);

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 92px);}

/* ============================================================ DARK MODE
   A night version of the same clinic, not an inversion. The ground becomes a
   warm olive-black, the botanical green lifts so it still reads as green, and
   champagne warms a step to survive the darker ground. */
:root[data-theme="dark"]{
  --ivory:#141610;
  --pearl:#1B1E16;
  --bone:#262A1F;
  --ink:#EDEAE0;
  --ink-soft:#B6B4A7;
  --ink-mute:#8B8C7E;
  --botanical:#9CB49F;
  --botanical-lt:#7D8F80;
  --champagne:#D6B87E;
  --line:rgba(237,234,224,.15);
  --line-soft:rgba(237,234,224,.08);
  --glass:rgba(20,22,16,.74);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px -18px rgba(0,0,0,.8);
  --band-bg:#0C0E09;
  --band-ink:#EDEAE0;
  --band-ink-soft:rgba(237,234,224,.60);
  --band-ink-mute:rgba(237,234,224,.42);
  --band-line:rgba(237,234,224,.14);
  --band-line-strong:rgba(237,234,224,.28);
  --band-accent:#D6B87E;
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light;}
body,.nav,.sec,.foot,.stat,.doc,.contact-cell,.aside-card,#loader,.svc-stage,.map,.gal figure{
  transition:background-color .45s var(--ease),color .45s var(--ease),border-color .45s var(--ease);
}

/* Arabic typographic tuning — not a mechanical flip. */
html[lang="ar"]{
  --display:"IBM Plex Sans Arabic","Inter",sans-serif;
  --body:"IBM Plex Sans Arabic","Inter",sans-serif;
}

*,*::before,*::after{box-sizing:inherit;}
html,body{margin:0;padding:0;}
body{
  background:var(--ivory);
  color:var(--ink);
  font-family:var(--body);
  font-size:var(--step-0);
  font-weight:400;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
html[lang="ar"] body{line-height:1.9;font-weight:300;}

img,svg,canvas{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
h1,h2,h3,h4{margin:0;font-weight:400;line-height:1.06;letter-spacing:-.015em;font-family:var(--display);}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3,html[lang="ar"] h4{
  font-weight:300;letter-spacing:0;line-height:1.28;
}
p{margin:0;}
:focus-visible{outline:2px solid var(--botanical);outline-offset:3px;border-radius:2px;}

.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter);}
.prose{max-width:62ch;}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

/* ---- skip link ---- */
.skip{position:fixed;inset-inline-start:1rem;top:-100px;z-index:999;background:var(--ink);color:var(--ivory);padding:.7rem 1.1rem;border-radius:2px;transition:top .2s;}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 1rem);}

/* ============================================================ LOADER */
#loader{
  position:fixed;inset:0;z-index:300;background:var(--ivory);color:var(--ink);
  display:grid;place-items:center;
  transition:opacity .8s var(--ease),visibility .8s;
  padding-top:env(safe-area-inset-top,0px);
}
#loader.done{opacity:0;visibility:hidden;}
.loader-in{display:grid;justify-items:center;gap:1.6rem;width:min(300px,64vw);}
.loader-mark{width:74px;height:74px;}
.loader-mark path,.loader-mark circle{
  fill:none;stroke:var(--botanical);stroke-width:1;
  stroke-dasharray:var(--len,200);stroke-dashoffset:var(--len,200);
  animation:draw 2.1s var(--ease) forwards;
}
@keyframes draw{to{stroke-dashoffset:0;}}
.loader-word{
  font-family:var(--display);font-size:1.5rem;letter-spacing:.42em;
  margin-inline-start:.42em;color:var(--ink);opacity:0;
  animation:fadeIn .9s var(--ease) .9s forwards;
}
.loader-bar{width:100%;height:1px;background:var(--line);position:relative;overflow:hidden;}
.loader-bar i{position:absolute;inset-block:0;inset-inline-start:0;width:0%;background:var(--champagne);transition:width .4s var(--ease);}
@keyframes fadeIn{to{opacity:1;}}

/* ============================================================ CURSOR */
#cursor,#cursor-ring{position:fixed;top:0;left:0;z-index:290;pointer-events:none;border-radius:50%;opacity:0;}
#cursor{width:5px;height:5px;background:var(--ink);margin:-2.5px 0 0 -2.5px;transition:opacity .3s;}
#cursor-ring{
  width:34px;height:34px;margin:-17px 0 0 -17px;border:1px solid var(--ink-mute);
  transition:width .32s var(--ease),height .32s var(--ease),margin .32s var(--ease),border-color .32s,opacity .3s,background .32s;
}
body.cursor-on #cursor,body.cursor-on #cursor-ring{opacity:1;}
body.cursor-on.c-link #cursor-ring{width:56px;height:56px;margin:-28px 0 0 -28px;border-color:var(--botanical);background:color-mix(in srgb,var(--botanical) 9%,transparent);}
body.cursor-on.c-media #cursor-ring{width:84px;height:84px;margin:-42px 0 0 -42px;border-color:rgba(191,163,107,.7);}
body.cursor-on.c-link #cursor{opacity:0;}
@media (hover:none),(pointer:coarse){#cursor,#cursor-ring{display:none;}}

/* ============================================================ NAV */
.nav{
  position:fixed;top:0;inset-inline:0;z-index:200;
  padding-top:env(safe-area-inset-top,0px);
  transition:background .5s var(--ease),box-shadow .5s var(--ease),backdrop-filter .5s;
}
.nav-in{
  display:flex;align-items:center;gap:clamp(1rem,3vw,2.6rem);
  height:78px;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter);
  transition:height .5s var(--ease);
}
.nav.compact{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 1px 0 var(--line-soft),0 14px 40px -30px rgba(27,28,25,.5);}
.nav.compact .nav-in{height:62px;}
.brand{display:flex;align-items:center;gap:.62rem;flex-shrink:0;}
.brand svg{width:26px;height:26px;flex:none;}
.brand b{font-family:var(--display);font-weight:400;font-size:1.06rem;letter-spacing:.3em;margin-inline-start:.3em;}
html[lang="ar"] .brand b{letter-spacing:0;margin-inline-start:0;font-size:1.15rem;}
.nav-links{display:flex;gap:clamp(.9rem,1.9vw,1.8rem);margin-inline:auto;align-items:center;}
.nav-links a{
  position:relative;font-size:var(--step--1);letter-spacing:.055em;color:var(--ink-soft);
  padding:.45rem 0;transition:color .3s;
}
html[lang="ar"] .nav-links a{letter-spacing:0;font-size:.92rem;}
.nav-links a::after{
  content:"";position:absolute;inset-inline-start:0;bottom:.15rem;height:1px;width:100%;
  background:var(--botanical);transform:scaleX(0);transform-origin:var(--to,left);
  transition:transform .45s var(--ease);
}
html[dir="rtl"] .nav-links a::after{--to:right;}
.nav-links a:hover,.nav-links a[aria-current="page"]{color:var(--ink);}
.nav-links a:hover::after,.nav-links a[aria-current="page"]::after{transform:scaleX(1);}
.nav-act{display:flex;align-items:center;gap:.8rem;flex-shrink:0;}

.lang{
  display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;
}
.lang button{padding:.34rem .72rem;font-size:.74rem;letter-spacing:.09em;color:var(--ink-mute);transition:background .3s,color .3s;}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--ivory);}

/* theme toggle — same pill language as the language switch */
.tgl{
  display:grid;place-items:center;width:34px;height:34px;flex:none;
  border:1px solid var(--line);border-radius:999px;color:var(--ink-mute);
  transition:color .3s,border-color .3s,background .3s;
}
.tgl:hover{color:var(--ink);border-color:var(--botanical);}
.tgl svg{width:16px;height:16px;}
.tgl .sun{display:none;} :root[data-theme="dark"] .tgl .sun{display:block;}
:root[data-theme="dark"] .tgl .moon{display:none;}
#menu .tgl,.foot .tgl{border-color:var(--band-line-strong);color:var(--band-ink-soft);}
#menu .tgl:hover,.foot .tgl:hover{color:var(--band-ink);border-color:var(--band-ink);}

/* photography frames — the generated tile is the base layer, the real
   photograph fades in over it when one is supplied and loads */
.media{position:relative;overflow:hidden;background:var(--bone);}
.media > img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .8s var(--ease),transform .9s var(--ease);
}
.media > img.loaded{opacity:1;}
.media.has-img::after{opacity:0;}
.doc:hover .media > img,.gal figure:hover .media > img{transform:scale(1.045);}
:root[data-theme="dark"] .tblobs{opacity:.5;filter:saturate(.7);}
:root[data-theme="dark"] .media > img{filter:brightness(.88) contrast(1.02);}

.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  padding:.82rem 1.5rem;font-size:var(--step--1);letter-spacing:.05em;
  border:1px solid var(--ink);color:var(--ivory);background:var(--ink);
  border-radius:1px;overflow:hidden;isolation:isolate;
  transition:transform .3s var(--ease),box-shadow .4s var(--ease);
}
html[lang="ar"] .btn{letter-spacing:0;}
.btn::before{
  content:"";position:absolute;inset:0;z-index:-1;background:var(--botanical);
  transform:translateY(101%);transition:transform .5s var(--ease);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -16px rgba(27,28,25,.55);}
.btn:hover::before{transform:translateY(0);}
.btn:active{transform:translateY(0) scale(.985);}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn.ghost::before{background:var(--ink);}
.btn.ghost:hover{color:var(--ivory);border-color:var(--ink);}
.btn.sm{padding:.6rem 1.1rem;}
.btn-nav{display:none;}
@media(min-width:1100px){.btn-nav{display:inline-flex;}}

.burger{display:grid;gap:5px;padding:.6rem .2rem;}
.burger i{display:block;width:22px;height:1px;background:var(--ink);transition:transform .45s var(--ease),opacity .3s;}
@media(min-width:1100px){.burger{display:none;}}
@media(max-width:1099px){.nav-links{display:none;}}

/* full-screen mobile menu */
#menu{
  position:fixed;inset:0;z-index:210;background:var(--band-bg);color:var(--band-ink);
  display:grid;grid-template-rows:auto 1fr auto;
  clip-path:inset(0 0 100% 0);transition:clip-path .78s var(--ease-io);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
#menu.open{clip-path:inset(0 0 0 0);}
#menu .m-top{display:flex;align-items:center;justify-content:space-between;height:78px;padding-inline:var(--gutter);}
#menu .m-top .brand b,#menu .m-top .brand svg{color:var(--band-ink);}
#menu .m-close i{background:var(--band-ink);}
#menu.open .m-close i:first-child{transform:translateY(3px) rotate(45deg);}
#menu.open .m-close i:last-child{transform:translateY(-3px) rotate(-45deg);}
#menu .m-close i:nth-child(2){opacity:0;}
.m-nav{padding-inline:var(--gutter);align-self:center;display:grid;gap:.1rem;overflow-y:auto;}
.m-nav a{
  font-family:var(--display);font-size:clamp(1.85rem,7.5vw,3rem);line-height:1.34;
  color:var(--band-ink);opacity:0;transform:translateY(22px);
  transition:opacity .6s var(--ease),transform .6s var(--ease),color .3s;
  border-bottom:1px solid var(--band-line);padding:.35rem 0;
  display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
}
.m-nav a span{font-family:var(--body);font-size:.7rem;letter-spacing:.14em;color:var(--band-ink-mute);}
html[lang="ar"] .m-nav a span{letter-spacing:0;}
#menu.open .m-nav a{opacity:1;transform:none;}
.m-foot{padding:0 var(--gutter) clamp(1.5rem,5vh,3rem);display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;}
.m-foot a{color:var(--band-ink-soft);font-size:var(--step--1);}
#menu .lang{border-color:var(--band-line-strong);}
#menu .lang button{color:var(--band-ink-soft);}
#menu .lang button[aria-pressed="true"]{background:var(--band-ink);color:var(--band-bg);}

/* ============================================================ HERO */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden;}
#scene{position:absolute;inset:0;z-index:0;}
#scene canvas{width:100%!important;height:100%!important;}
.hero-fallback{
  position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(60% 55% at 62% 40%,rgba(255,255,255,.95),transparent 70%),
    radial-gradient(48% 46% at 38% 62%,rgba(125,143,128,.22),transparent 72%),
    radial-gradient(40% 40% at 74% 74%,rgba(191,163,107,.16),transparent 70%),
    linear-gradient(170deg,var(--pearl),var(--bone));
}
:root[data-theme="dark"] .hero-fallback{
  background:
    radial-gradient(58% 52% at 62% 38%,rgba(214,184,126,.16),transparent 72%),
    radial-gradient(50% 48% at 34% 64%,rgba(156,180,159,.13),transparent 74%),
    radial-gradient(70% 60% at 50% 100%,rgba(0,0,0,.5),transparent 70%),
    linear-gradient(170deg,#1D2018,#0E100A);
}
.hero-grad{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(to top,var(--ivory) 4%,color-mix(in srgb,var(--ivory) 55%,transparent) 34%,transparent 62%);
}
.hero-in{position:relative;z-index:2;width:100%;padding-block:clamp(3rem,10vh,6.5rem) clamp(4.5rem,11vh,7rem);}
.hero h1{font-size:var(--step-5);max-width:16ch;}
html[lang="ar"] .hero h1{max-width:19ch;}
.hero .kicker{
  display:block;font-family:var(--body);font-size:var(--step--1);letter-spacing:.22em;
  color:var(--botanical);margin-bottom:1.5rem;
}
html[lang="ar"] .hero .kicker{letter-spacing:0;font-size:.9rem;}
.hero .lede{margin-top:1.7rem;max-width:46ch;color:var(--ink-soft);font-size:var(--step-1);line-height:1.6;}
.hero-cta{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2.4rem;}
.scroll-cue{
  position:absolute;z-index:2;bottom:calc(1.6rem + env(safe-area-inset-bottom,0px));
  inset-inline-end:var(--gutter);display:flex;align-items:center;gap:.7rem;
  font-size:.7rem;letter-spacing:.2em;color:var(--ink-mute);
}
html[lang="ar"] .scroll-cue{letter-spacing:0;}
.scroll-cue i{display:block;width:44px;height:1px;background:var(--line);position:relative;overflow:hidden;}
.scroll-cue i::after{content:"";position:absolute;inset-block:0;width:40%;background:var(--botanical);animation:cue 2.4s var(--ease-io) infinite;}
@keyframes cue{0%{transform:translateX(-110%)}55%{transform:translateX(260%)}100%{transform:translateX(260%)}}
@media(max-width:720px){.scroll-cue{display:none;}}

/* ============================================================ SECTIONS */
.sec{padding-block:var(--rhythm);position:relative;}
.sec.dark{background:var(--band-bg);color:var(--band-ink);}
.sec.dark .lede{color:var(--band-ink-soft);}
.sec.dark .note{color:var(--band-ink-mute);}
.sec.dark .rule{background:var(--band-line);}
.sec.dark .btn.ghost,.foot .btn.ghost{color:var(--band-ink);border-color:var(--band-line-strong);}
.sec.dark .btn.ghost::before,.foot .btn.ghost::before{background:var(--band-ink);}
.sec.dark .btn.ghost:hover,.foot .btn.ghost:hover{color:var(--band-bg);border-color:var(--band-ink);}
.sec.dark .btn.invert{background:var(--band-ink);color:var(--band-bg);border-color:var(--band-ink);}
.sec.dark .btn.invert::before{background:var(--band-accent);}
.sec.dark .field label{color:var(--band-ink-mute);}
.sec.dark .field input,.sec.dark .field select,.sec.dark .field textarea{
  color:var(--band-ink);border-bottom-color:var(--band-line-strong);}
.sec.dark .field input:focus,.sec.dark .field select:focus,.sec.dark .field textarea:focus{
  border-bottom-color:var(--band-accent);}
.sec.dark .formstate{border-color:var(--band-accent);background:rgba(191,163,107,.12);color:var(--band-ink);}
.sec.dark :focus-visible,.foot :focus-visible{outline-color:var(--band-accent);}

.rv{opacity:0;transform:translateY(20px);transition:opacity .9s var(--ease),transform .9s var(--ease);}

/* ============================================================ STORY / FLOWER */
.story-art{position:relative;aspect-ratio:1/1.08;display:grid;place-items:center;}
.story-art svg{width:86%;height:auto;overflow:visible;}
.petal{fill:none;stroke:var(--botanical);stroke-width:.7;opacity:.5;transform-origin:center;}
.story-art .disc{fill:none;stroke:var(--champagne);stroke-width:.6;opacity:.55;}
.story-art figcaption{position:absolute;bottom:0;inset-inline-start:0;font-size:.74rem;color:var(--ink-mute);letter-spacing:.1em;}
html[lang="ar"] .story-art figcaption{letter-spacing:0;}
.story-copy p + p{margin-top:1.25rem;}
.story-copy .big{font-family:var(--display);font-size:var(--step-2);line-height:1.34;color:var(--ink);}

/* ============================================================ SERVICES */
.svc-layout{display:grid;gap:clamp(1.6rem,4vw,3.4rem);}
@media(min-width:1000px){.svc-layout{grid-template-columns:1fr 1.25fr;align-items:start;}}
.svc-stage{position:relative;aspect-ratio:1/1;border:1px solid var(--line);background:
  radial-gradient(70% 60% at 50% 42%,var(--pearl),transparent 72%),
  linear-gradient(160deg,rgba(125,143,128,.1),rgba(191,163,107,.07));
  display:grid;place-items:center;overflow:hidden;position:sticky;top:110px;}
@media(max-width:999px){.svc-stage{position:relative;top:0;aspect-ratio:16/10;}}
.svc-stage canvas{width:100%;height:100%;}
.svc-stage .cap{position:absolute;bottom:1.1rem;inset-inline-start:1.2rem;font-size:.74rem;color:var(--ink-mute);letter-spacing:.12em;max-width:70%;}
html[lang="ar"] .svc-stage .cap{letter-spacing:0;}

.svc-list{display:grid;}
.svc-row{
  position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:1.2rem;align-items:center;
  padding:1.35rem .25rem;border-top:1px solid var(--line);
  transition:padding-inline .45s var(--ease),background .45s var(--ease);
  width:100%;text-align:start;
}
.svc-row:last-child{border-bottom:1px solid var(--line);}
.svc-row .num{font-size:.72rem;color:var(--ink-mute);font-variant-numeric:tabular-nums;width:2ch;}
.svc-row .t{font-family:var(--display);font-size:var(--step-1);transition:transform .45s var(--ease);}
html[lang="ar"] .svc-row .t{font-size:1.15rem;}
.svc-row .d{display:block;font-family:var(--body);font-size:var(--step--1);color:var(--ink-mute);
  max-height:0;opacity:0;overflow:hidden;transition:max-height .5s var(--ease),opacity .4s var(--ease),margin .5s var(--ease);}
.svc-row .go{opacity:0;transform:translateX(-6px);transition:opacity .4s,transform .4s var(--ease);color:var(--botanical);font-size:.74rem;letter-spacing:.14em;}
html[dir="rtl"] .svc-row .go{transform:translateX(6px);}
.svc-row:hover,.svc-row:focus-visible,.svc-row.active{background:linear-gradient(90deg,rgba(125,143,128,.07),transparent);padding-inline:1rem;}
.svc-row:hover .d,.svc-row.active .d,.svc-row:focus-visible .d{max-height:5.5rem;opacity:1;margin-top:.45rem;}
.svc-row:hover .go,.svc-row.active .go,.svc-row:focus-visible .go{opacity:1;transform:none;}

/* ============================================================ STATS */
.stats{display:grid;gap:1px;background:var(--line);border-block:1px solid var(--line);}
@media(min-width:640px){.stats{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1000px){.stats{grid-template-columns:repeat(4,1fr);}}
.stat{background:var(--ivory);padding:clamp(1.8rem,4vw,3rem) clamp(1.1rem,2.4vw,2rem);}
.sec.dark .stats{background:var(--band-line);border-color:var(--band-line);}
.sec.dark .stat{background:var(--band-bg);}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:var(--step-4);line-height:1;font-variant-numeric:tabular-nums;}
.stat span{display:block;margin-top:.7rem;font-size:var(--step--1);color:var(--ink-mute);letter-spacing:.08em;}
html[lang="ar"] .stat span{letter-spacing:0;}
.sec.dark .stat span{color:var(--band-ink-soft);}

/* ============================================================ DOCTORS */
.docs{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);}
@media(min-width:600px){.docs{grid-template-columns:repeat(2,1fr);}}
@media(min-width:960px){.docs{grid-template-columns:repeat(3,1fr);}}
.doc{
  background:var(--ivory);padding:clamp(1.4rem,2.6vw,2rem);text-align:start;
  display:grid;gap:1rem;align-content:start;position:relative;
  transition:background .5s var(--ease),transform .5s var(--ease);
}
.doc:hover,.doc:focus-visible{background:var(--pearl);}
.doc-portrait{
  aspect-ratio:4/5;overflow:hidden;position:relative;
  background:linear-gradient(165deg,var(--bone),rgba(125,143,128,.18));
}
.doc-portrait svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .9s var(--ease);}
.doc:hover .doc-portrait svg{transform:scale(1.05);}
.doc-portrait::after{
  content:attr(data-init);position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--display);font-size:clamp(2rem,4vw,2.8rem);color:var(--ink-mute);opacity:.45;
  letter-spacing:.06em;transition:opacity .5s;
}
.doc h3{font-size:var(--step-1);}
html[lang="ar"] .doc h3{font-size:1.14rem;}
.doc .spec{font-size:var(--step--1);color:var(--ink-mute);line-height:1.5;}
.doc .more{font-size:.72rem;letter-spacing:.16em;color:var(--botanical);opacity:0;transform:translateY(5px);transition:.4s var(--ease);}
html[lang="ar"] .doc .more{letter-spacing:0;}
.doc:hover .more,.doc:focus-visible .more{opacity:1;transform:none;}

/* ============================================================ GALLERY */
.gal{columns:2;column-gap:clamp(.7rem,1.6vw,1.2rem);}

.gal figure{break-inside:avoid;margin:0 0 clamp(.7rem,1.6vw,1.2rem);position:relative;overflow:hidden;background:var(--bone);}
.gal button{display:block;width:100%;padding:0;}
.gal .tile{width:100%;display:block;transition:transform 1s var(--ease);}
.gal figure:hover .tile{transform:scale(1.04);}
.gal figcaption{position:absolute;inset-inline:0;bottom:0;padding:.9rem 1rem;font-size:.76rem;

.gal figure:hover figcaption,.gal button:focus-visible figcaption{opacity:1;}

#light{position:fixed;inset:0;z-index:250;background:color-mix(in srgb,var(--band-bg) 96%,transparent);display:none;place-items:center;padding:clamp(1rem,5vw,3rem);}
#light.on{display:grid;}
#light .frame{max-width:min(1000px,92vw);width:100%;}
#light .frame img,#light .frame svg{width:100%;height:auto;border:1px solid var(--band-line);}
#light .meta{display:flex;justify-content:space-between;gap:1rem;color:var(--band-ink-soft);font-size:.8rem;margin-top:1rem;}
#light .x,#light .p,#light .n{position:absolute;color:var(--band-ink);padding:1rem;font-size:.86rem;letter-spacing:.1em;}
#light .x{top:calc(env(safe-area-inset-top,0px) + .6rem);inset-inline-end:.6rem;}
#light .p{inset-inline-start:.4rem;top:50%;}
#light .n{inset-inline-end:.4rem;top:50%;}

/* ============================================================ ACCORDION */
.acc{border-top:1px solid var(--line);}
.acc-item{border-bottom:1px solid var(--line);}
.acc-q{width:100%;display:flex;gap:1.2rem;align-items:center;justify-content:space-between;

html[lang="ar"] .acc-q{font-size:1.1rem;}

.acc-q .ic::before{inset-inline:0;top:50%;height:1px;margin-top:-.5px;}
.acc-q .ic::after{inset-block:0;left:50%;width:1px;margin-left:-.5px;transition:opacity .4s;}
.acc-item.open .acc-q .ic{transform:rotate(90deg);}
.acc-item.open .acc-q .ic::after{opacity:0;}
.acc-a{max-height:0;overflow:hidden;transition:max-height .55s var(--ease);}
.acc-a > div{padding:0 0 1.5rem;color:var(--ink-soft);max-width:66ch;}

}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-bottom-color:var(--botanical);}
.field textarea{resize:vertical;min-height:100px;}
.form-grid{display:grid;gap:1.5rem;}

html[lang="ar"] .contact-cell .v{font-size:1.1rem;}
.contact-cell a.v:hover{color:var(--botanical);}
.map{

  background:linear-gradient(150deg,var(--pearl),var(--bone));
}
.map svg{position:absolute;inset:0;width:100%;height:100%;}
.map .pin{position:absolute;top:47%;left:54%;width:14px;height:14px;margin:-7px 0 0 -7px;}
.map .pin::before,.map .pin::after{content:"";position:absolute;inset:0;border-radius:50%;}
.map .pin::before{background:var(--botanical);}
.map .pin::after{border:1px solid var(--botanical);animation:ping 2.8s var(--ease-io) infinite;}

.map .lbl{position:absolute;bottom:1rem;inset-inline-start:1rem;background:var(--glass);backdrop-filter:blur(10px);

function petalPath(i,n,r1,r2,cx,cy){
  var a = (i/n)*Math.PI*2 - Math.PI/2, w = Math.PI/n*0.82;
  var p=function(ang,r){return [(cx+Math.cos(ang)*r).toFixed(2),(cy+Math.sin(ang)*r).toFixed(2)];};
  var tip=p(a,r2), l=p(a-w,r1), rr=p(a+w,r1), b=p(a,r1*0.34);
  return "M"+b[0]+" "+b[1]+"C"+l[0]+" "+l[1]+" "+tip[0]+" "+tip[1]+" "+tip[0]+" "+tip[1]+
         "C"+tip[0]+" "+tip[1]+" "+rr[0]+" "+rr[1]+" "+b[0]+" "+b[1]+"Z";
}
function mark(size,stroke){
  var n=8,s="",c=size/2;
  for(var i=0;i<n;i++) s+='<path d="'+petalPath(i,n,size*0.16,size*0.46,c,c)+'" fill="none" stroke="'+stroke+'" stroke-width="'+(size/40)+'" stroke-linejoin="round"/>';
  s+='<circle cx="'+c+'" cy="'+c+'" r="'+(size*0.075)+'" fill="none" stroke="'+stroke+'" stroke-width="'+(size/40)+'"/>';
  return s;
}

/* deterministic abstract tile — organic field, no photography, no stock */
function tile(seed,w,h){
  var r=function(n){var x=Math.sin(seed*99.13+n*37.7)*10000;return x-Math.floor(x);};
  var hues=[[70,88,75],[191,163,107],[237,232,222],[27,28,25]];
  var a=hues[Math.floor(r(1)*3)], b=hues[Math.floor(r(2)*3)];
  var g="g"+seed;
  var blobs="";
  for(var i=0;i<4;i++){
    blobs+='<ellipse cx="'+(15+r(i+3)*70)+'%" cy="'+(15+r(i+9)*70)+'%" rx="'+(16+r(i+5)*26)+'%" ry="'+(14+r(i+7)*24)+'%" fill="url(#'+g+')" opacity="'+(0.2+r(i+11)*0.32).toFixed(2)+'"/>';
  }
  var lines="";
  for(var j=0;j<7;j++){
    var y=(j+1)*(100/8);
    lines+='<path d="M0 '+y+' Q 25 '+(y-4-r(j)*7)+' 50 '+y+' T 100 '+y+'" fill="none" stroke="var(--line)" stroke-width="0.22" vector-effect="non-scaling-stroke"/>';
  }
  return '<svg class="tile" viewBox="0 0 100 '+Math.round(100*h/w)+'" preserveAspectRatio="none" aria-hidden="true" focusable="false">'+
    '<defs><radialGradient id="'+g+'"><stop offset="0%" stop-color="rgb('+a.join(",")+')" stop-opacity=".55"/>'+
    '<stop offset="100%" stop-color="rgb('+b.join(",")+')" stop-opacity="0"/></radialGradient></defs>'+
    '<rect width="100" height="'+Math.round(100*h/w)+'" fill="var(--bone)"/>'+
    '<g class="tblobs">'+blobs+'</g>'+
    '<g transform="scale(1,'+(h/w)+')">'+lines+'</g></svg>';
}

/* A frame that prefers the real photograph and degrades to the tile.
   The <img> is attached in wire() rather than via inline handlers. */
function pic(src,alt,seed,w,h){
  var out = tile(seed,w,h);
  if(src) out += '<img data-src="'+esc(src)+'" alt="'+esc(alt)+'" width="'+w+'" height="'+h+'">';
  return out;
}
function attachImages(root){
  $$("img[data-src]",root||document).forEach(function(im){
    var frame = im.parentNode;
    im.loading="lazy"; im.decoding="async";
    im.addEventListener("load",function(){
      im.classList.add("loaded");
      if(frame && frame.classList) frame.classList.add("has-img");
    });
    im.addEventListener("error",function(){ if(im.parentNode) im.parentNode.removeChild(im); });
    im.src = im.getAttribute("data-src");
    im.removeAttribute("data-src");
  });
}

function observe(){
  var els=$$(".rv");
  if(RM || !("IntersectionObserver" in window)){ els.forEach(function(e){e.classList.add("in");}); return; }
  var io=new IntersectionObserver(function(en){
    en.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
  },{rootMargin:"0px 0px -8% 0px",threshold:.08});
  els.forEach(function(e){io.observe(e);});
}

function countUp(){
  var box=$("#stats"); if(!box) return;
  var nums=$$("b[data-to]",box);
  var run=function(){
    nums.forEach(function(n){
      var to=parseInt(n.getAttribute("data-to"),10);
      if(RM){ n.textContent=to.toLocaleString(state.lang==="ar"?"ar-EG":"en-US"); return; }
      var st=null,dur=1500;
      var step=function(ts){
        if(!st) st=ts;
        var p=Math.min((ts-st)/dur,1), e=1-Math.pow(1-p,3);
        n.textContent=Math.round(to*e).toLocaleString(state.lang==="ar"?"ar-EG":"en-US");
        if(p<1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  };
  if(!("IntersectionObserver" in window)){ run(); return; }
  var io=new IntersectionObserver(function(en){
    if(en[0].isIntersecting){ run(); io.disconnect(); }
  },{threshold:.35});
  io.observe(box);
}

function accordion(){
  $$("#acc .acc-q").forEach(function(q){
    q.addEventListener("click",function(){
      var item=q.parentNode, open=item.classList.contains("open");
      $$("#acc .acc-item").forEach(function(it){
        it.classList.remove("open");
        it.querySelector(".acc-q").setAttribute("aria-expanded","false");
        it.querySelector(".acc-a").style.maxHeight="0px";
      });
      if(!open){
        item.classList.add("open");
        q.setAttribute("aria-expanded","true");
        var a=item.querySelector(".acc-a");
        a.style.maxHeight=a.scrollHeight+"px";
      }
    });
  });
}

function gallery(){
  var box=$("#gal"); if(!box) return;
  var figs=$$("figure",box), cur=0, lb=$("#light");
  function show(i){
    cur=(i+figs.length)%figs.length;
    var f=figs[cur], im=f.querySelector("img.loaded");
    if(im){
      $("#lframe").innerHTML='<img src="'+im.getAttribute("src")+'" alt="'+(im.getAttribute("alt")||"")+'">';
    }else{
      $("#lframe").innerHTML=f.querySelector("svg").outerHTML;
      $("#lframe").firstChild.removeAttribute("class");
    }
    $("#lcap").textContent=f.querySelector("figcaption").textContent;
    $("#lidx").textContent=(cur+1)+" / "+figs.length;
    lb.classList.add("on"); $("#lx").focus();
  }
  function close(){ lb.classList.remove("on"); }
  $$("button[data-g]",box).forEach(function(b){
    b.addEventListener("click",function(){ show(parseInt(b.getAttribute("data-g"),10)); });
  });
  $("#lx").onclick=close;
  $("#lp").onclick=function(){show(cur-1);};
  $("#ln").onclick=function(){show(cur+1);};
  lb.onclick=function(e){ if(e.target===lb) close(); };
  document.onkeydown=function(e){
    if(!lb.classList.contains("on")) return;
    if(e.key==="Escape") close();
    if(e.key==="ArrowRight") show(document.dir==="rtl"?cur-1:cur+1);
    if(e.key==="ArrowLeft") show(document.dir==="rtl"?cur+1:cur-1);
  };
  /* touch swipe */
  var sx=0;
  lb.addEventListener("touchstart",function(e){sx=e.touches[0].clientX;},{passive:true});
  lb.addEventListener("touchend",function(e){
    var dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>50) show(dx<0?cur+1:cur-1);
  },{passive:true});
}

/* ---------------------------------------------------------------- 3D: HERO
   An abstract translucent sculpture: twelve petals of the Cady flower,
   a pearl core, and a low count of drifting motes. Not a human figure. */
function envMap(renderer){
  var dark=isDark();
  var c=document.createElement("canvas"); c.width=512; c.height=256;
  var g=c.getContext("2d");
  var grad=g.createLinearGradient(0,0,0,256);
  if(dark){
    /* night studio: one soft overhead source, everything else falls away */
    grad.addColorStop(0,"#5d5f50"); grad.addColorStop(.38,"#33352c");
    grad.addColorStop(.66,"#1b1d16"); grad.addColorStop(1,"#0a0b07");
  }else{
    grad.addColorStop(0,"#ffffff"); grad.addColorStop(.42,"#f3efe6");
    grad.addColorStop(.62,"#d9d3c4"); grad.addColorStop(1,"#8f907f");
  }
  g.fillStyle=grad; g.fillRect(0,0,512,256);
  var warm=g.createRadialGradient(150,70,5,150,70,160);
  warm.addColorStop(0, dark?"rgba(255,232,186,.55)":"rgba(255,246,225,.95)");
  warm.addColorStop(1,"rgba(255,246,225,0)");
  g.fillStyle=warm; g.fillRect(0,0,512,256);
  var cool=g.createRadialGradient(390,130,5,390,130,170);
  cool.addColorStop(0, dark?"rgba(140,168,146,.35)":"rgba(190,205,192,.7)");
  cool.addColorStop(1,"rgba(190,205,192,0)");
  g.fillStyle=cool; g.fillRect(0,0,512,256);
  var tex=new THREE.CanvasTexture(c);
  tex.mapping=THREE.EquirectangularReflectionMapping;
  var pm=new THREE.PMREMGenerator(renderer); pm.compileEquirectangularShader();
  var env=pm.fromEquirectangular(tex).texture;
  tex.dispose(); pm.dispose();
  return env;
}
function petalGeometry(){
  var sh=new THREE.Shape();
  sh.moveTo(0,0);
  sh.bezierCurveTo(0.42,0.30, 0.34,1.15, 0,1.62);
  sh.bezierCurveTo(-0.34,1.15,-0.42,0.30, 0,0);
  return new THREE.ExtrudeGeometry(sh,{
    depth:0.055, bevelEnabled:true, bevelThickness:0.05, bevelSize:0.055,
    bevelSegments:3, curveSegments:MOBILE?12:22
  });
}
function makeRenderer(el,alpha){
  var c=document.createElement("canvas");
  var gl=c.getContext("webgl2")||c.getContext("webgl")||c.getContext("experimental-webgl");
  if(!gl) return null;
  var r;
  try{
    r=new THREE.WebGLRenderer({canvas:c,antialias:!MOBILE,alpha:alpha!==false,powerPreference:"high-performance"});
  }catch(e){ return null; }
  r.setPixelRatio(Math.min(window.devicePixelRatio||1, MOBILE?1.4:1.85));
  r.outputEncoding=THREE.sRGBEncoding;
  r.toneMapping=THREE.ACESFilmicToneMapping;
  r.toneMappingExposure=1.02;
  el.appendChild(c);
  return r;
}
function heroScene(el){
  if(RM) return function(){};                       /* reduced motion: gradient only */
  var renderer=makeRenderer(el,true);
  if(!renderer) return function(){};                /* no WebGL: gradient fallback shows */

  var scene=new THREE.Scene();
  var cam=new THREE.PerspectiveCamera(36,1,.1,100);
  cam.position.set(0,0,9.2);
  var env=envMap(renderer); scene.environment=env;

  var group=new THREE.Group(); scene.add(group);
  var flower=new THREE.Group(); group.add(flower);

  var dark=isDark();
  var pearl=new THREE.MeshPhysicalMaterial({
    color: dark?0xd9d2c2:0xf7f2e9, roughness:.22, metalness:0, clearcoat:1, clearcoatRoughness:.22,
    transparent:true, opacity: dark?.82:.9, side:THREE.DoubleSide, envMapIntensity: dark?1.5:1.15
  });
  var leaf=new THREE.MeshPhysicalMaterial({
    color: dark?0x78896f:0xa9b8a8, roughness:.3, metalness:0, clearcoat:.8, clearcoatRoughness:.3,
    transparent:true, opacity: dark?.66:.72, side:THREE.DoubleSide, envMapIntensity: dark?1.35:1
  });

  var pg=petalGeometry();
  var rings=[{n:MOBILE?7:9,r:1.55,tilt:.58,sc:1.5,m:pearl},
             {n:MOBILE?6:8,r:1.0,tilt:1.02,sc:1.05,m:leaf}];
  rings.forEach(function(ring,ri){
    for(var i=0;i<ring.n;i++){
      var p=new THREE.Mesh(pg,ring.m);
      var a=(i/ring.n)*Math.PI*2 + ri*0.4;
      p.scale.setScalar(ring.sc);
      p.rotation.z=-a;
      p.rotation.x=ring.tilt;
      p.position.set(Math.cos(a)*ring.r*0.18,Math.sin(a)*ring.r*0.18,ri*-0.22);
      p.userData.base=p.rotation.x;
      p.userData.ph=i*0.5+ri;
      flower.add(p);
    }
  });
  var core=new THREE.Mesh(
    new THREE.SphereGeometry(.62,MOBILE?26:44,MOBILE?18:32),
    new THREE.MeshPhysicalMaterial({color: dark?0xe6e0d0:0xffffff,roughness:.06,metalness:0,
      clearcoat:1,clearcoatRoughness:.04,transparent:true,opacity: dark?.5:.62,
      envMapIntensity: dark?2.1:1.6})
  );
  flower.add(core);
  var ring=new THREE.Mesh(
    new THREE.TorusGeometry(2.55,.012,8,MOBILE?64:128),
    new THREE.MeshStandardMaterial({color: dark?0xd6b87e:0xbfa36b,roughness:.3,metalness:.85,
      envMapIntensity: dark?1.9:1.3})
  );
  ring.rotation.x=Math.PI*.46; group.add(ring);

  /* motes — deliberately few */
  var N=MOBILE?90:200, pos=new Float32Array(N*3);
  for(var i=0;i<N;i++){
    var rr=2.4+Math.random()*4.2, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=rr*Math.sin(ph)*Math.cos(th); pos[i*3+1]=rr*Math.sin(ph)*Math.sin(th)*.6; pos[i*3+2]=rr*Math.cos(ph)*.5;
  }
  var pgeo=new THREE.BufferGeometry();
  pgeo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  var motes=new THREE.Points(pgeo,new THREE.PointsMaterial({
    color: dark?0xcfd6c6:0x9aa79a, size:.035, transparent:true, opacity: dark?.42:.5,
    sizeAttenuation:true, depthWrite:false}));
  scene.add(motes);

  scene.add(new THREE.AmbientLight(0xfff6e8, dark?.18:.5));
  var key=new THREE.DirectionalLight(0xfff4e2, dark?1.5:1.15); key.position.set(3.2,4,5); scene.add(key);
  var rim=new THREE.DirectionalLight(0xc9d6c6, dark?.85:.6); rim.position.set(-4,-1.6,-3); scene.add(rim);

  var mx=0,my=0,tx=0,ty=0,scrollN=0,alive=true;
  function onMove(e){
    var w=window.innerWidth,h=window.innerHeight;
    tx=(e.clientX/w-.5)*2; ty=(e.clientY/h-.5)*2;
  }
  function onScroll(){ scrollN=Math.min(window.scrollY/Math.max(window.innerHeight,1),1.6); }
  if(!COARSE) window.addEventListener("mousemove",onMove,{passive:true});
  window.addEventListener("scroll",onScroll,{passive:true});

  var baseY=.35;
  function size(){
    var w=el.clientWidth||1,h=el.clientHeight||1;
    renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
    baseY = w/h > 1.15 ? .35 : 1.5;
    /* Keep the sculpture off the copy. The copy sits on the leading edge,
       so in Arabic the sculpture moves to the left, not just mirrored CSS. */
    var wide = w/h > 1.15;
    var side = (document.documentElement.dir === "rtl") ? -1 : 1;
    group.position.x = wide ? 2.15 * side : 0;
    group.position.y = wide ? .35 : 1.5;
    group.scale.setScalar(wide ? 1 : .78);
  }
  var ro = window.ResizeObserver ? new ResizeObserver(size) : null;
  if(ro) ro.observe(el); else window.addEventListener("resize",size);
  size();

  var visible=true;
  var vio = ("IntersectionObserver" in window) ? new IntersectionObserver(function(en){
    visible=en[0].isIntersecting;
  },{threshold:.01}) : null;
  if(vio) vio.observe(el);

  var t0=performance.now();
  (function loop(now){
    if(!alive) return;
    requestAnimationFrame(loop);
    if(!visible || document.hidden) return;
    var e=(now-t0)/1000;
    mx+=(tx-mx)*.045; my+=(ty-my)*.045;

    flower.rotation.z = e*0.075;
    flower.rotation.x = -0.22 + my*0.16 + Math.sin(e*.33)*.035;
    flower.rotation.y = mx*0.22*((document.documentElement.dir==="rtl")?-1:1);

    flower.children.forEach(function(p){
      if(p.userData.base===undefined) return;
      p.rotation.x = p.userData.base + Math.sin(e*.6+p.userData.ph)*.055 + scrollN*.34;
    });
    core.scale.setScalar(1+Math.sin(e*.85)*.022);
    ring.rotation.z = -e*0.11;
    ring.rotation.y = mx*0.12;
    motes.rotation.y = e*0.018;
    motes.rotation.x = my*0.05;

    /* scroll choreography: the sculpture recedes and lifts as the story begins */
    group.position.z = -scrollN*3.4;
    group.rotation.z = scrollN*0.18;
    group.position.y = baseY + scrollN*1.1;
    cam.position.x = mx*0.28; cam.position.y = -my*0.2;
    cam.lookAt(0,0,0);

    renderer.render(scene,cam);
  })(t0);

  return function(){
    alive=false;
    if(ro) ro.disconnect(); else window.removeEventListener("resize",size);
    if(vio) vio.disconnect();
    window.removeEventListener("mousemove",onMove);
    window.removeEventListener("scroll",onScroll);
    pg.dispose(); pgeo.dispose(); env.dispose();
    scene.traverse(function(o){ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
    renderer.dispose();
    if(renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
  };
}

};
function serviceScene(el){
  if(RM) { el.style.background="radial-gradient(60% 55% at 50% 45%,var(--pearl),rgba(125,143,128,.16))"; return function(){}; }
  var renderer=makeRenderer(el,true);
  if(!renderer){ el.style.background="radial-gradient(60% 55% at 50% 45%,var(--pearl),rgba(125,143,128,.16))"; return function(){}; }

  var scene=new THREE.Scene();
  var cam=new THREE.PerspectiveCamera(34,1,.1,60); cam.position.set(0,0,6.4);
  var env=envMap(renderer); scene.environment=env;

  var dark=isDark();
  var mat=new THREE.MeshPhysicalMaterial({
    color:0xe8dccb, roughness:.16, metalness:.04, clearcoat:1, clearcoatRoughness:.12,
    transparent:true, opacity:.94, envMapIntensity: dark?1.75:1.35, flatShading:true
  });
  var geo=new THREE.IcosahedronGeometry(1.72, MOBILE?1:2);
  var obj=new THREE.Mesh(geo,mat); scene.add(obj);

  var wire=new THREE.Mesh(
    new THREE.IcosahedronGeometry(2.24,1),
    new THREE.MeshBasicMaterial({color: dark?0xd6b87e:0xbfa36b, wireframe:true,
      transparent:true, opacity: dark?.2:.14})
  );
  scene.add(wire);

  scene.add(new THREE.AmbientLight(0xfff6ea, dark?.2:.55));
  var l1=new THREE.DirectionalLight(0xffffff, dark?1.35:1.05); l1.position.set(2.6,3.4,4.2); scene.add(l1);
  var l2=new THREE.DirectionalLight(0xbcc8ba, dark?.75:.5); l2.position.set(-3,-2,-2); scene.add(l2);

  var target=new THREE.Color(0xe8dccb), spin=1, alive=true, hoverBoost=0;
  var rows=$$(".svc-row",document);
  function setCat(cat){
    var c=CAT_COLOR[cat];
    if(c){ target.setHex(c); if(dark) target.multiplyScalar(.82); }
    hoverBoost=1;
  }
  rows.forEach(function(r){
    var enter=function(){ rows.forEach(function(x){x.classList.remove("active");});
      r.classList.add("active"); setCat(r.getAttribute("data-cat")); };
    r.addEventListener("mouseenter",enter);
    r.addEventListener("focus",enter);
  });

  function size(){ var w=el.clientWidth||1,h=el.clientHeight||1;
    renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
  var ro=window.ResizeObserver?new ResizeObserver(size):null;
  if(ro) ro.observe(el); else window.addEventListener("resize",size);
  size();

  var visible=true;
  var vio=("IntersectionObserver" in window)?new IntersectionObserver(function(en){visible=en[0].isIntersecting;},{threshold:.02}):null;
  if(vio) vio.observe(el);

  var t0=performance.now();
  (function loop(now){
    if(!alive) return;
    requestAnimationFrame(loop);
    if(!visible||document.hidden) return;
    var e=(now-t0)/1000;
    hoverBoost*=0.955;
    obj.rotation.y = e*0.16*spin;
    obj.rotation.x = Math.sin(e*0.28)*0.22;
    obj.scale.setScalar(1+hoverBoost*0.05+Math.sin(e*0.7)*0.01);
    wire.rotation.y = -e*0.07;
    wire.rotation.z = e*0.04;
    mat.color.lerp(target,0.055);
    renderer.render(scene,cam);
  })(t0);

  return function(){
    alive=false;
    if(ro) ro.disconnect(); else window.removeEventListener("resize",size);
    if(vio) vio.disconnect();
    geo.dispose(); mat.dispose(); env.dispose();
    scene.traverse(function(o){ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
    renderer.dispose();
    if(renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
  };
}

/* ---------------------------------------------------------------- TRANSITIONS */
var veil=$("#veil"), first=true, lastHash=null;
function navigate(){
  if(location.hash===lastHash) return;
  if(first || RM){ render(); first=false; return; }
  veil.classList.remove("out"); veil.classList.add("in");
  setTimeout(function(){
    render();
    veil.classList.remove("in"); veil.classList.add("out");
  },420);
}
window.addEventListener("hashchange",navigate);

/* ---------------------------------------------------------------- BOOT */
function boot(){
  if(!location.hash) location.replace("#/en/");
  render(); first=false;
  var bar=$("#lbar"), p=0;
  var tick=setInterval(function(){
    p=Math.min(p+18+Math.random()*22,100); bar.style.width=p+"%";
    if(p>=100){ clearInterval(tick);
      setTimeout(function(){ $("#loader").classList.add("done");
        setTimeout(function(){ var l=$("#loader"); if(l&&l.parentNode) l.parentNode.removeChild(l); },900);
      },RM?0:340);
    }
  },RM?1:180);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
})();
</script>
